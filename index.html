<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <!--
      The site had no favicon at all: a blank tab, an unbranded bookmark, and a
      missing icon in Google's mobile results, which show one beside every
      listing. SVG first for sharpness at any size, .ico for the older browsers
      and for Google's favicon crawler, apple-touch-icon for the iOS home screen.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1A3A" />

    <!--
      The hero still and film are served from CloudFront and the hero image is
      the LCP element on every page. Without this the browser cannot even start
      the handshake until it has parsed the <img>, so the single most important
      request on the page begins with a cold DNS + TCP + TLS round trip.
    -->
    <link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin />
    <link rel="dns-prefetch" href="https://d8j0ntlcm91z4.cloudfront.net" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts load ASYNCHRONOUSLY. A plain <link rel="stylesheet"> to Google Fonts is
      render-blocking: the browser will not paint a single pixel until it has made a
      round trip to fonts.googleapis.com AND a second one to fonts.gstatic.com. On a
      throttled mobile connection that was the largest single cost in our LCP, and it
      was larger than anything else on the page.

      rel="preload" as="style" fetches it off the critical path, then onload promotes
      it to a real stylesheet. <noscript> covers the no-JS case. Combined with
      display=swap, text paints immediately in the system fallback and swaps when
      Montserrat, Instrument Serif and Hanken arrive.

      Trimmed the weights too: 400/600/700 for Montserrat and 400/500/600/700 for
      Hanken. Fewer font files, less to download.

      v13: NO ITALIC ANYWHERE ON THE SITE, so no italic face is requested - the
      Montserrat italic axis and the Instrument Serif italic are both dropped.
      Three fewer font files on every first load. Instrument Serif roman is the
      editorial face and carries only the emphasis lines (.em) and the pull quotes;
      Montserrat stays the structural display face and the wordmark, which is the
      standing brand rule. The serif is the warmth; the sans is the system. If
      italic is ever wanted again, the axis has to come back into this URL first.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Montserrat:wght@400;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Montserrat:wght@400;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!--
      Netlify Forms detection stub. Netlify scans this static HTML at deploy and
      registers the "lead" form. The React form posts to it. Do not remove.
    -->
    <form name="lead" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="text" name="contact" />
      <textarea name="goal"></textarea>
    </form>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

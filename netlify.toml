# Every real route is prerendered to its own index.html, so this rule is only
# reached by URLs that do not exist. It MUST return a real 404.
# THIS RULE STAYS LAST.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Long-cache the fingerprinted build assets. Netlify already no-caches HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted stills and films, once fetch-assets.sh has been run. Long, but
# NOT immutable - these are hand-named, so a replaced file has to be able to
# actually replace itself.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
